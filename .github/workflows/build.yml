name: build

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # ForgeGradle decompiles and remaps Minecraft into its own cache directory, which the Gradle
      # cache above does not cover. Keyed on the versions that decide its contents.
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/forge_gradle
          key: forge-gradle-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: forge-gradle-${{ runner.os }}-

      # Formatting, Error Prone, NullAway, ArchUnit and JUnit all fail this one task.
      - run: ./gradlew build
