plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'net.ltgt.errorprone' version '4.0.1'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// GameTests. Their own source set, so they stay out of the jar while mirroring the main package
// names, which keeps them package-private access to what they test.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

// Formatting. There is one format - `config/eclipse-format.properties` - and the build holds every
// source set to it: `spotlessCheck` runs as part of `build`, and `spotlessApply` rewrites the
// sources.
spotless {
    java {
        eclipse(eclipse_jdt_version).configFile 'config/eclipse-format.properties'
        importOrder '', '\\#'
        removeUnusedImports()
    }
}

// Error Prone over every source set of this mod, with NullAway over the mod's own packages. A
// finding is an error, never a warning, so nothing accumulates unattended. `-Xlint` is what turns
// javac's own findings - a deprecated call, an unchecked cast, a raw type - into warnings at all;
// without it javac reports them as notes that `-Werror` cannot see. `processing` is off because
// Error Prone sits on the processor path without claiming an annotation.
//
// This is deliberately scoped to the mod's own source sets rather than to every JavaCompile.
// ForgeGradle recompiles Minecraft itself through a JavaCompile task it creates on the fly, and
// Minecraft's own sources carry hundreds of deprecation warnings: held to `-Werror` that recompile
// fails, and with it every mapping change. The failure only appears when the mapped artifact is not
// already cached, which is what makes it worth naming here.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.errorprone.enabled = false
}

[sourceSets.main, sourceSets.test, sourceSets.gametest]*.compileJavaTaskName.each { name ->
    tasks.named(name, JavaCompile).configure {
        options.errorprone {
            enabled = true
            disableWarningsInGeneratedCode = true
            error 'NullAway'
            option 'NullAway:AnnotatedPackages', mod_group_id
        }
        options.compilerArgs << '-Xlint:all,-processing' << '-Werror'
    }
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Mixin refmap remapping. A dependency mod ships its refmap in SRG names, and this dev
            // runtime runs on the mapped ones, so without this Mixin looks for `m_135870_` on a class
            // that calls it `bootStrap` and the injection fails outright. AE2 needs it; Create does
            // not, because ForgeGradle rewrites the refmap of a jar it deobfuscates and AE2's is not
            // in a form it rewrites.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.gametest
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // Data generation. Writes every generated resource into `src/generated/resources`, which is a
        // resource source dir of the main source set, so what it writes is what ships.
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }

        // Runs every registered GameTest headlessly and exits, which is what CI can use.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()

    // Create, and the Ponder and Flywheel it bundles.
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
    }

    // Applied Energistics 2.
    maven {
        name = 'Modmaven'
        url = 'https://modmaven.dev'
    }

    // GuideME, which AE2 requires at runtime and publishes nowhere else.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
}

dependencies {
    // Specify the version of Minecraft to use.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Error Prone and NullAway. Compile-time only; they run as compiler plugins.
    errorprone "com.google.errorprone:error_prone_core:${errorprone_version}"
    errorprone "com.uber.nullaway:nullaway:${nullaway_version}"

    // Create and AE2. Hard dependencies per docs/00-decisions.md - there is no standalone mode, so
    // neither is optional and neither is branched around. Create's `all` artifact carries the Ponder,
    // Flywheel and Registrate it needs as nested jars, so a runtime loading Create already holds
    // them. Ponder is named all the same, compile-time only: KineticBlockEntity implements one of
    // its interfaces, and javac resolves no method on a class whose supertypes it cannot read.
    implementation fg.deobf("com.simibubi.create:create-1.20.1:${create_version}:all")
    compileOnly fg.deobf("net.createmod.ponder:Ponder-Forge-1.20.1:${ponder_version}")
    implementation fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    runtimeOnly fg.deobf("maven.modrinth:guideme:${guideme_version}")

    // JUnit over the model, and ArchUnit over the package structure. Both live in `src/test/java`;
    // ArchUnit's DoNotIncludeTests option is what keeps the model tests out of the structural analysis.
    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunit_version}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    // Data generation's own bookkeeping, which belongs beside the generated files and not in the jar.
    exclude '.cache'

    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
            create_version_range: create_version_range, ae2_version_range: ae2_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Compile the GameTests with everything else, so a broken one fails the build, not the client.
tasks.named('build').configure {
    dependsOn 'gametestClasses'
}

